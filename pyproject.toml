[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "meatproxy"
version = "0.1.0"
description = "A small, unbloated LLM router: triage on a local NPU model, route to local / on-prem / cloud (GitHub Copilot) backends."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "PyYAML>=6.0",
    "prometheus-client>=0.20",
    "aiosqlite>=0.20",
    "github-copilot-sdk>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[project.scripts]
meatproxy = "meatproxy.main:run"

[tool.hatch.build.targets.wheel]
packages = ["src/meatproxy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
